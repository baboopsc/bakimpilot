# Full BakımPilot stack.  Usage:
#   cp .env.example .env            # then edit secrets
#   docker compose up -d --build
#   docker compose run --rm api python manage.py seed_demo   # optional demo data
# Web UI: http://localhost:3000   API docs: http://localhost:8000/api/docs/

x-backend: &backend
  build: ./backend
  image: bakimpilot-api
  restart: unless-stopped
  environment: &backend-env
    DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set DJANGO_SECRET_KEY in .env}
    DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
    DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,api}
    DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-}
    DATABASE_URL: postgres://${POSTGRES_USER:-bakimpilot}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-bakimpilot}
    REDIS_URL: redis://redis:6379/0
    REFRESH_COOKIE_SECURE: ${REFRESH_COOKIE_SECURE:-true}
    MEDIA_ROOT: /app/media
    LLM_PROVIDER: ${LLM_PROVIDER:-auto}
    LLM_MODEL: ${LLM_MODEL:-}
    LLM_API_KEY: ${LLM_API_KEY:-}
    EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-mock}
    LOGIN_THROTTLE: ${LOGIN_THROTTLE:-10/min}
    INGEST_TOKEN: ${INGEST_TOKEN:?set INGEST_TOKEN in .env}
  volumes:
    - media:/app/media
  depends_on:
    db: { condition: service_healthy }
    redis: { condition: service_healthy }

services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bakimpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-bakimpilot}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20

  # One-shot: apply DB migrations before the API and workers start.
  migrate:
    <<: *backend
    restart: "no"
    command: python manage.py migrate --noinput

  api:
    <<: *backend
    ports: ["8000:8000"]
    depends_on:
      migrate: { condition: service_completed_successfully }

  worker:
    <<: *backend
    command: celery -A config worker --loglevel=info --concurrency=2
    healthcheck: { disable: true }
    depends_on:
      migrate: { condition: service_completed_successfully }

  beat:
    <<: *backend
    # Exactly ONE beat process may run, or scheduled jobs would fire twice.
    command: celery -A config beat --loglevel=info --schedule /tmp/celerybeat-schedule
    healthcheck: { disable: true }
    depends_on:
      migrate: { condition: service_completed_successfully }

  web:
    build:
      context: ./frontend
      args:
        API_ORIGIN: http://api:8000
    image: bakimpilot-web
    restart: unless-stopped
    ports: ["3000:3000"]
    depends_on:
      api: { condition: service_healthy }

  # Flight-data ingestion (Go): ground stations POST raw telemetry here.
  ingest:
    build: ./ingest
    image: bakimpilot-ingest
    restart: unless-stopped
    environment:
      INGEST_TOKEN: ${INGEST_TOKEN:?set INGEST_TOKEN in .env}
      API_URL: http://api:8000/api/ingest/flights/
    ports: ["8080:8080"]
    depends_on:
      api: { condition: service_healthy }

volumes:
  pgdata:
  media:
