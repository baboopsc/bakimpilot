name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.13"
  NODE_VERSION: "24"

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg17
        env: { POSTGRES_USER: bakimpilot, POSTGRES_PASSWORD: bakimpilot, POSTGRES_DB: bakimpilot }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bakimpilot" --health-interval 5s --health-retries 20
    env:
      DATABASE_URL: postgres://bakimpilot:bakimpilot@localhost:5432/bakimpilot
      DJANGO_SECRET_KEY: ci-only-secret-key-not-used-anywhere-else
    defaults:
      run: { working-directory: backend }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Migrations are up to date
        run: python manage.py makemigrations --check --dry-run
      - name: Django system checks (production settings)
        run: python manage.py check --deploy --fail-level ERROR
      - name: Tests
        run: pytest -p no:cacheprovider

  frontend:
    name: Frontend (lint + types + unit + build)
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: frontend }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: End-to-end (Playwright, real stack)
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg17
        env: { POSTGRES_USER: bakimpilot, POSTGRES_PASSWORD: bakimpilot, POSTGRES_DB: bakimpilot }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bakimpilot" --health-interval 5s --health-retries 20
    env:
      DATABASE_URL: postgres://bakimpilot:bakimpilot@localhost:5432/bakimpilot
      DJANGO_SECRET_KEY: ci-only-secret-key-not-used-anywhere-else
      DJANGO_DEBUG: "true"
      REFRESH_COOKIE_SECURE: "false"
      LOGIN_THROTTLE: 1000/min
      CELERY_TASK_ALWAYS_EAGER: "true" # no broker needed: background jobs run inline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Start API with demo data
        working-directory: backend
        run: |
          pip install -r requirements.txt
          python manage.py migrate --noinput
          python manage.py seed_demo
          nohup python manage.py runserver 0.0.0.0:8000 > ../api.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:8000/api/health/ && break; sleep 1; done
      - name: Build web
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run build
      - name: Playwright
        working-directory: frontend
        run: npx playwright test
        env: { CI: "true" }
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
            api.log
          retention-days: 7

  docker:
    name: Docker images + compose smoke test
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    env:
      DJANGO_SECRET_KEY: ci-only-secret-key-not-used-anywhere-else
      POSTGRES_PASSWORD: ci-password
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,api
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose files
        run: |
          docker compose config --quiet
          DOMAIN=example.com docker compose -f docker-compose.yml -f docker-compose.prod.yml config --quiet
      - name: Build and start the stack
        run: |
          docker compose up -d --build
          # (not `--wait`: the one-shot `migrate` service exits by design)
          for i in $(seq 1 90); do curl -sf http://localhost:3000/login -o /dev/null && break; sleep 2; done
      - name: Smoke test
        run: |
          curl -sf http://localhost:8000/api/health/
          curl -sf -o /dev/null http://localhost:3000/login
          curl -sf http://localhost:3000/api/health/        # through the Next.js proxy
          docker compose run --rm api python manage.py seed_demo
          docker compose exec -T api python -c "import django,os;os.environ.setdefault('DJANGO_SETTINGS_MODULE','config.settings');django.setup();from apps.alerts.tasks import run_due_check;print(run_due_check.delay().get(timeout=60))"
      - if: always()
        run: docker compose logs --no-color | tail -200
      - if: always()
        run: docker compose down -v
