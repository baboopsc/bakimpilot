# Render Blueprint for the free BakımPilot demo API (D-034, docs/deploy.md).
# Render → New → Blueprint → pick this repo. Values marked `sync: false` are
# asked for once in the dashboard and never stored in git.
services:
  - type: web
    name: bakimpilot-api
    runtime: python
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: bash scripts/render-start.sh
    healthCheckPath: /api/health/
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.5"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      # Neon connection string, e.g. postgresql://user:pass@ep-xxx.eu-central-1.aws.neon.tech/neondb?sslmode=require
      - key: DATABASE_URL
        sync: false
      # The Vercel frontend origin, e.g. https://bakimpilot.vercel.app (no trailing slash)
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        sync: false
      # No Redis / worker on the free plan: tasks run inline (D-035).
      - key: CELERY_TASK_ALWAYS_EAGER
        value: "true"
      # Optional. Empty = offline mock AI provider (D-036).
      - key: LLM_API_KEY
        sync: false
      - key: WEB_CONCURRENCY
        value: "2"
      # Everyone clicks the same demo button; give them a bit more room.
      - key: LOGIN_THROTTLE
        value: "30/min"
      - key: DEMO_RESET_ON_START
        value: "false"
